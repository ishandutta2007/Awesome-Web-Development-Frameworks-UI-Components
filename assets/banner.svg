<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Light Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Sphere Gradients -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Filter for soft blur -->
    <filter id="blur-large" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      .badge-float-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .badge-float-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .badge-float-3 {
        animation: float3 8s ease-in-out infinite alternate;
      }
      .glow-pulse {
        animation: pulse 5s ease-in-out infinite alternate;
      }
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.96); }
        100% { opacity: 0.7; transform: scale(1.05); }
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Glowing Background Orbs -->
  <g class="glow-pulse" style="transform-origin: 200px 100px;">
    <circle cx="220" cy="120" r="180" fill="url(#glow-cyan)" filter="url(#blur-large)" />
  </g>
  <g class="glow-pulse" style="transform-origin: 1000px 260px; animation-delay: 2.5s;">
    <circle cx="1000" cy="240" r="190" fill="url(#glow-purple)" filter="url(#blur-large)" />
  </g>
  <g class="glow-pulse" style="transform-origin: 600px 190px; animation-delay: 1.2s;">
    <circle cx="600" cy="190" r="160" fill="url(#glow-indigo)" filter="url(#blur-large)" />
  </g>

  <!-- Geometric Grid Pattern Overlay -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Ambient Light Sweep Bar -->
  <rect x="0" y="376" width="1200" height="4" fill="url(#beam-grad)" rx="2" />

  <!-- Dynamic / Floating Tech Pills in Background Sides -->
  <!-- Left Side Badges -->
  <g class="badge-float-1" transform="translate(60, 65)">
    <rect width="145" height="38" rx="19" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">⚛️ React 19</text>
  </g>

  <g class="badge-float-2" transform="translate(45, 145)">
    <rect width="140" height="38" rx="19" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#818cf8" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">⚡ Next.js SSR</text>
  </g>

  <g class="badge-float-3" transform="translate(70, 225)">
    <rect width="155" height="38" rx="19" fill="url(#card-grad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#34d399" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">🎨 Tailwind CSS</text>
  </g>

  <!-- Right Side Badges -->
  <g class="badge-float-2" transform="translate(985, 70)">
    <rect width="150" height="38" rx="19" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#c084fc" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">🧩 shadcn/ui</text>
  </g>

  <g class="badge-float-1" transform="translate(995, 150)">
    <rect width="155" height="38" rx="19" fill="url(#card-grad)" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#f43f5e" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">🚀 Astro Islands</text>
  </g>

  <g class="badge-float-3" transform="translate(975, 230)">
    <rect width="165" height="38" rx="19" fill="url(#card-grad)" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#fbbf24" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">⚡ Headless CMS</text>
  </g>

  <!-- Center Card Frame (Glassmorphism backdrop) -->
  <rect x="230" y="45" width="740" height="290" rx="20" fill="#0f172a" fill-opacity="0.55" stroke="#475569" stroke-opacity="0.3" stroke-width="1" />

  <!-- Center Category Pill -->
  <g transform="translate(485, 68)">
    <rect width="230" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1" />
    <text x="115" y="19" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle" class="font-sans">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Highlights (Crisp & High Contrast) -->
  <g id="foreground-content" class="font-sans">
    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-size="34" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome Web Development Frameworks
    </text>
    <text x="600" y="192" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
      &amp; UI Components
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" text-anchor="middle" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Full-Stack SSR/SSG • Accessible Component Kits • Headless CMS • Cloud Infrastructure
    </text>

    <!-- Metric / Feature Badges in Center -->
    <g transform="translate(320, 268)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="82" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8">🌐 Full-Stack Ready</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="170" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="85" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#a855f7">♿ WCAG Accessible</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(375, 0)">
        <rect width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="87" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">⭐ Production Battle-Tested</text>
      </g>
    </g>
  </g>
</svg>
